<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conversor TasCal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
    --border: #334155; --primary: #3b82f6; --success: #10b981; --danger: #ef4444;
    --input-bg: #0f172a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; font-size: 14px; }
  .app-container { display: flex; flex-direction: column; height: 100%; }
  .top-panel { flex-shrink: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); z-index: 10; }
  .card { background: var(--panel); border-radius: 8px; padding: 8px 10px; box-shadow: 0 2px 4px rgba(0,0,0,.2); border: 1px solid var(--border); }
  
  .tasa-row { display: flex; align-items: stretch; gap: 4px; }
  .nav-btn { 
    width: 28px; background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border); 
    border-radius: 6px; font-size: 16px; display: flex; align-items: center; justify-content: center; 
    cursor: pointer; flex-shrink: 0;
  }
  .nav-btn:disabled { opacity: 0.3; }
  .nav-btn:active:not(:disabled) { background: var(--border); }
  
  .tasa-box { 
    flex: 1; background: var(--input-bg); padding: 4px; border-radius: 6px; text-align: center; 
    display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--border); 
    min-width: 0;
  }
  .tasa-box span { font-size: 9px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;}
  .tasa-box strong { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .btn-refresh { width: 36px; background: var(--border); color: var(--text); border: none; border-radius: 6px; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .btn-refresh:active { background: var(--text-muted); }
  
  .date-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding: 0 2px; }
  .date-label { font-size: 10px; color: var(--text-muted); font-weight: 600; }
  .btn-manual { 
    background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 600; 
    cursor: pointer; padding: 2px 4px; text-decoration: underline; 
  }

  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row > * { flex: 1; min-width: 0; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
  input, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; height: 38px; background: var(--input-bg); color: var(--text); }
  input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
  button { padding: 0 10px; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; height: 38px; color: var(--text); transition: opacity 0.2s; }
  button:active { opacity: .7; }
  button.success { background: var(--success); flex: 2; color: #fff;}
  button.secondary { background: var(--border); flex: 1; }
  .resultado-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 6px; padding: 6px; text-align: center; font-size: 20px; font-weight: 700; color: var(--success); margin-bottom: 6px; min-height: 38px; display: flex; align-items: center; justify-content: center; }
  .scroll-area { flex: 1; overflow-y: auto; padding: 0 8px 8px 8px; }
  .lista { list-style: none; padding: 0; margin: 0; }
  .lista li { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 8px 10px; border-radius: 6px; margin-bottom: 4px; border: 1px solid var(--border); gap: 8px; }
  .lista .info { flex: 1; min-width: 0; }
  .lista .info div:first-child { font-size: 13px; color: var(--text); }
  .lista .detalle { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  .lista .valor { font-weight: 700; white-space: nowrap; font-size: 15px; color: var(--text); }
  .lista .del { background: rgba(239, 68, 68, 0.15); color: var(--danger); width: 28px; height: 28px; min-height: 28px; padding: 0; border-radius: 6px; font-size: 16px; flex-shrink: 0; border: 1px solid rgba(239, 68, 68, 0.3); }
  .empty { text-align: center; color: var(--text-muted); padding: 20px; font-size: 13px; }
  .bottom-panel { flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; }
  .bottom-panel .label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  .bottom-panel .val { font-size: 18px; font-weight: 700; color: var(--primary); line-height: 1.1; }
  .btn-limpiar { background: var(--input-bg); border: 1px solid var(--border); width: 36px; height: 36px; font-size: 16px; display: flex; align-items: center; justify-content: center; }

  /* MODAL DE ESCÁNER EN VIVO */
  .scanner-modal {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: none; flex-direction: column; justify-content: space-between;
  }
  .scanner-modal.active { display: flex; }
  .video-wrapper { position: relative; flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  video#cam-video { width: 100%; height: 100%; object-fit: cover; }
  
  /* Mira de enfoque central (solo lee dentro de esta caja) */
  .scan-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  .scan-box {
    width: 78%; max-width: 320px; height: 74px;
    border: 2.5px solid #10b981; border-radius: 10px;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
    background: transparent;
    position: relative;
  }
  .scan-hint {
    color: #fff; font-size: 12px; font-weight: 600; margin-bottom: 12px;
    background: rgba(15, 23, 42, 0.8); padding: 4px 10px; border-radius: 12px;
    z-index: 2;
  }
  .scanner-controls {
    background: var(--panel); padding: 14px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px; z-index: 10;
  }
  .live-readout {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; text-align: center;
  }
  .live-readout span { font-size: 11px; color: var(--text-muted); display: block; }
  .live-readout strong { font-size: 24px; color: var(--success); letter-spacing: 0.5px; }
  .scanner-btns { display: flex; gap: 8px; }
</style>
</head>
<body>

<div class="app-container">
  <div class="top-panel">
    <div class="card" style="padding: 6px;">
      <div class="tasa-row">
        <button id="btn-prev" class="nav-btn" title="Tasa anterior">←</button>
        <div class="tasa-box"><span>Dólar</span><strong id="tasa-usd">--</strong></div>
        <button id="btn-actualizar" class="btn-refresh" title="Actualizar Tasa">↻</button>
        <div class="tasa-box"><span>Euro</span><strong id="tasa-eur">--</strong></div>
        <button id="btn-next" class="nav-btn" title="Tasa siguiente">→</button>
      </div>
      <div class="date-bar">
        <span id="date-label" class="date-label">Fecha: --</span>
        <button id="btn-manual" class="btn-manual">+ Tasa manual</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div><label>De</label><select id="divisa-origen"><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="VES">VES Bs</option></select></div>
        <div><label>A</label><select id="divisa-destino"><option value="VES" selected>VES Bs</option><option value="USD">USD $</option><option value="EUR">EUR €</option></select></div>
      </div>
      <div class="row">
        <div style="flex:2"><label>Precio</label><input type="number" id="precio" placeholder="0,00" step="0.01" min="0" inputmode="decimal"></div>
        <div style="flex:1"><label>Cant.</label><input type="number" id="multiplicador" value="1" step="1" min="1" inputmode="numeric"></div>
      </div>
      <div class="resultado-box" id="resultado-unitario">0,00</div>
      <div class="row" style="margin-bottom:0;">
        <button id="btn-foto" class="secondary">📷 Escanear</button>
        <button id="btn-agregar" class="success">➕ Añadir</button>
      </div>
    </div>
  </div>

  <div class="scroll-area">
    <ul class="lista" id="lista-items"></ul>
    <div id="empty-msg" class="empty">Añade productos para ver el total</div>
  </div>

  <div class="bottom-panel">
    <div>
      <div class="label">Total a pagar</div>
      <div class="val" id="total-pagar">0,00 Bs</div>
    </div>
    <button id="btn-limpiar" class="btn-limpiar">🗑️</button>
  </div>
</div>

<!-- VISOR DE ESCÁNER EN VIVO -->
<div id="scanner-modal" class="scanner-modal">
  <div class="video-wrapper">
    <video id="cam-video" autoplay playsinline muted></video>
    <div class="scan-overlay">
      <div class="scan-hint">Encuadra SOLO el número dentro del recuadro</div>
      <div id="scan-box" class="scan-box"></div>
    </div>
  </div>
  <div class="scanner-controls">
    <div class="live-readout">
      <span id="scan-status">Iniciando cámara...</span>
      <strong id="live-number">--</strong>
    </div>
    <div class="scanner-btns">
      <button id="btn-cancel-scan" class="secondary">Cancelar</button>
      <button id="btn-confirm-scan" class="success" disabled>✅ Usar este número</button>
    </div>
  </div>
</div>

<script>
  // --- ESTADO GLOBAL ---
  let tasasHistorial = {}; 
  let fechaActual = null;  
  let items = []; 
  let ocrWorker = null;

  // Variables del escáner en vivo
  let videoStream = null;
  let scanInterval = null;
  let isProcessingFrame = false;
  let ultimoNumeroDetectado = null;

  const $ = id => document.getElementById(id);
  const elTasaUSD = $('tasa-usd'), elTasaEUR = $('tasa-eur');
  const elDateLabel = $('date-label');
  const elResultado = $('resultado-unitario');
  const elLista = $('lista-items'), elEmpty = $('empty-msg');
  const elTotal = $('total-pagar');
  const inputPrecio = $('precio'), inputMult = $('multiplicador');
  const selOrigen = $('divisa-origen'), selDestino = $('divisa-destino');
  const btnPrev = $('btn-prev'), btnNext = $('btn-next');

  const scannerModal = $('scanner-modal');
  const videoEl = $('cam-video');
  const scanBoxEl = $('scan-box');
  const scanStatusEl = $('scan-status');
  const liveNumberEl = $('live-number');
  const btnConfirmScan = $('btn-confirm-scan');

  const simbolo = div => div === 'VES' ? 'Bs' : div === 'USD' ? '$' : '€';
  const getTasas = () => tasasHistorial[fechaActual] || { USD: 0, EUR: 0 };

  // --- FORMATEO NUMÉRICO (PUNTO PARA MILES, COMA PARA DECIMALES) ---
  function formatearNumero(num) {
    if (isNaN(num)) return "0,00";
    return num.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // --- 1. PERSISTENCIA ---
  function cargarHistorial() {
    try {
      const guardado = localStorage.getItem('tasasBCV_historial');
      if (guardado) tasasHistorial = JSON.parse(guardado);
    } catch (e) {}
  }

  function guardarHistorial() {
    try {
      localStorage.setItem('tasasBCV_historial', JSON.stringify(tasasHistorial));
    } catch (e) {}
  }

  // --- 2. FECHAS ---
  function getFechaHoy() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatearFecha(fechaStr) {
    if (!fechaStr) return '--';
    const [y, m, d] = fechaStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function fechasOrdenadas() {
    return Object.keys(tasasHistorial).sort();
  }

  function actualizarInterfazTasas() {
    const t = getTasas();
    elTasaUSD.textContent = t.USD ? formatearNumero(t.USD) : '--';
    elTasaEUR.textContent = t.EUR ? formatearNumero(t.EUR) : '--';
    elDateLabel.textContent = `Fecha: ${formatearFecha(fechaActual)}`;

    const fechas = fechasOrdenadas();
    const idx = fechas.indexOf(fechaActual);
    btnPrev.disabled = idx <= 0;
    btnNext.disabled = idx === -1 || idx >= fechas.length - 1;

    recalcularPreview();
    renderizarLista();
  }

  function navegarFecha(direccion) {
    const fechas = fechasOrdenadas();
    if (fechas.length === 0) return;
    let idx = fechas.indexOf(fechaActual);
    if (idx === -1) idx = fechas.length - 1;
    const nuevoIdx = idx + direccion;
    if (nuevoIdx >= 0 && nuevoIdx < fechas.length) {
      fechaActual = fechas[nuevoIdx];
      actualizarInterfazTasas();
    }
  }

  // --- 3. API TASAS ---
  async function obtenerTasaAPI() {
    elTasaUSD.textContent = '...'; elTasaEUR.textContent = '...';
    let nuevaTasa = null;

    try {
      const res = await fetch('https://bcvhoy.com/api/tasas');
      if (!res.ok) throw new Error();
      const d = await res.json();
      nuevaTasa = { USD: d.oficial, EUR: d.euro };
    } catch {
      try {
        const r2 = await fetch('https://datos.cromstudio.com.ve/tasa');
        if (!r2.ok) throw new Error();
        const d2 = await r2.json();
        nuevaTasa = { USD: d2.tasas.USD, EUR: d2.tasas.EUR };
      } catch {
        elTasaUSD.textContent = 'Err'; elTasaEUR.textContent = 'Err';
        alert('No se pudo obtener la tasa. Revisa tu conexión o usa "Tasa manual".');
        return;
      }
    }

    if (nuevaTasa && nuevaTasa.USD > 0) {
      const hoy = getFechaHoy();
      tasasHistorial[hoy] = nuevaTasa;
      guardarHistorial();
      fechaActual = hoy;
      actualizarInterfazTasas();
    }
  }

  // --- 4. TASA MANUAL ---
  function agregarTasaManual() {
    const fechaInput = prompt("Ingresa la fecha (YYYY-MM-DD):", getFechaHoy());
    if (!fechaInput || !/^\d{4}-\d{2}-\d{2}$/.test(fechaInput)) return;
    const usdInput = prompt("Ingresa la tasa del Dólar (USD):");
    if (!usdInput) return;
    const usd = parseFloat(usdInput.replace(',', '.'));
    if (isNaN(usd) || usd <= 0) return;

    const eurInput = prompt("Ingresa la tasa del Euro (EUR):");
    if (!eurInput) return;
    const eur = parseFloat(eurInput.replace(',', '.'));
    if (isNaN(eur) || eur <= 0) return;

    tasasHistorial[fechaInput] = { USD: usd, EUR: eur };
    guardarHistorial();
    fechaActual = fechaInput;
    actualizarInterfazTasas();
  }

  // --- 5. ESCÁNER EN VIVO CON RECORTE DE MIRA (ROI) ---
  async function prepararWorkerOCR() {
    if (ocrWorker) return ocrWorker;
    ocrWorker = await Tesseract.createWorker('eng'); // 'eng' es más rápido y preciso para números puros
    await ocrWorker.setParameters({
      tessedit_char_whitelist: '0123456789.,',
      tessedit_pageseg_mode: '7' // Modo 7: Trata la imagen como UNA SOLA LÍNEA DE TEXTO
    });
    return ocrWorker;
  }
  prepararWorkerOCR().catch(() => {});

  async function abrirEscaner() {
    ultimoNumeroDetectado = null;
    liveNumberEl.textContent = '--';
    btnConfirmScan.disabled = true;
    scanStatusEl.textContent = 'Abriendo cámara...';
    scannerModal.classList.add('active');

    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      videoEl.srcObject = videoStream;
      await videoEl.play();

      scanStatusEl.textContent = 'Apunta al precio...';
      await prepararWorkerOCR();

      // Analiza un fotograma recortado cada 850ms
      scanInterval = setInterval(capturarYAnalizarRecuadro, 850);
    } catch (err) {
      console.error(err);
      scanStatusEl.textContent = '❌ No se pudo acceder a la cámara.';
    }
  }

  function cerrarEscaner() {
    clearInterval(scanInterval);
    scanInterval = null;
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    scannerModal.classList.remove('active');
  }

  async function capturarYAnalizarRecuadro() {
    if (isProcessingFrame || !videoStream || videoEl.readyState < 2 || !ocrWorker) return;
    isProcessingFrame = true;

    try {
      const vw = videoEl.videoWidth;
      const vh = videoEl.videoHeight;
      if (!vw || !vh) { isProcessingFrame = false; return; }

      // Calcular coordenadas exactas del recuadro verde en proporción al video real
      const boxRect = scanBoxEl.getBoundingClientRect();
      const vidRect = videoEl.getBoundingClientRect();

      const scaleX = vw / vidRect.width;
      const scaleY = vh / vidRect.height;

      const cropX = Math.max(0, (boxRect.left - vidRect.left) * scaleX);
      const cropY = Math.max(0, (boxRect.top - vidRect.top) * scaleY);
      const cropW = Math.min(vw - cropX, boxRect.width * scaleX);
      const cropH = Math.min(vh - cropY, boxRect.height * scaleY);

      const canvas = document.createElement('canvas');
      // Escalamos el recorte para que los dígitos tengan buen tamaño para Tesseract
      canvas.width = 480;
      canvas.height = Math.round(480 * (cropH / cropW));
      const ctx = canvas.getContext('2d');

      ctx.drawImage(videoEl, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      // Preprocesamiento: Escala de grises + detección automática de fondo oscuro/claro + binarización
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      let sumaBrillo = 0;

      for (let i = 0; i < data.length; i += 4) {
        const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        sumaBrillo += lum;
      }
      const promedioBrillo = sumaBrillo / (data.length / 4);
      const esFondoOscuro = promedioBrillo < 115; // Si es pantalla en modo oscuro, invertimos colores

      for (let i = 0; i < data.length; i += 4) {
        const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        let val = lum < promedioBrillo * 0.88 ? 0 : 255;
        if (esFondoOscuro) val = 255 - val; // Dejar siempre texto negro sobre fondo blanco puro
        data[i] = val; data[i + 1] = val; data[i + 2] = val;
      }
      ctx.putImageData(imgData, 0, 0);

      const { data: { text } } = await ocrWorker.recognize(canvas);
      const limpioTexto = text.trim();

      // Buscar el número más largo/completo dentro del recuadro
      const matches = limpioTexto.match(/\d{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?|\d+(?:[.,]\d+)?/g);
      if (matches && matches.length > 0) {
        // Tomar la coincidencia con más dígitos (ignora basura suelta)
        matches.sort((a, b) => b.length - a.length);
        let raw = matches[0];

        // Normalizar comas y puntos correctamente
        if (raw.includes(',') && raw.includes('.')) {
          if (raw.indexOf(',') > raw.indexOf('.')) {
            raw = raw.replace(/\./g, '').replace(',', '.'); // Ej: 1.250,50 -> 1250.50
          } else {
            raw = raw.replace(/,/g, ''); // Ej: 1,250.50 -> 1250.50
          }
        } else if (raw.includes(',')) {
          // Si tiene una coma y 2 decimales al final (ej: 45,50), es decimal
          const partes = raw.split(',');
          if (partes[partes.length - 1].length <= 2) {
            raw = raw.replace(',', '.');
          } else {
            raw = raw.replace(/,/g, ''); // Separador de miles
          }
        } else if (raw.includes('.')) {
          // Si tiene puntos múltiples o 3 dígitos al final (ej: 12.500), es miles
          const partes = raw.split('.');
          if (partes.length > 2 || partes[partes.length - 1].length === 3) {
            raw = raw.replace(/\./g, '');
          }
        }

        const numeroFinal = parseFloat(raw);
        if (!isNaN(numeroFinal) && numeroFinal > 0) {
          ultimoNumeroDetectado = numeroFinal;
          liveNumberEl.textContent = formatearNumero(numeroFinal);
          scanStatusEl.textContent = '✅ Número detectado (toca Usar para confirmar)';
          btnConfirmScan.disabled = false;
        }
      }
    } catch (e) {
      // Silenciar errores de fotogramas sueltos
    } finally {
      isProcessingFrame = false;
    }
  }

  // --- 6. CONVERSIÓN Y LISTA ---
  function convertir(monto, origen, destino) {
    const t = getTasas();
    if (origen === destino) return monto;
    if (origen === 'VES') return destino === 'USD' ? monto / t.USD : monto / t.EUR;
    if (destino === 'VES') return origen === 'USD' ? monto * t.USD : monto * t.EUR;
    const enVES = origen === 'USD' ? monto * t.USD : monto * t.EUR;
    return destino === 'USD' ? enVES / t.USD : enVES / t.EUR;
  }

  function recalcularPreview() {
    const precio = parseFloat(inputPrecio.value) || 0;
    const mult = parseFloat(inputMult.value) || 1;
    const t = getTasas();
    if (precio <= 0 || t.USD === 0) { elResultado.textContent = '0,00'; return; }
    const r = convertir(precio * mult, selOrigen.value, selDestino.value);
    elResultado.textContent = `${formatearNumero(r)} ${simbolo(selDestino.value)}`;
  }

  function renderizarLista() {
    const destino = selDestino.value; const sim = simbolo(destino);
    elLista.innerHTML = ''; let total = 0;

    items.forEach((item, i) => {
      const enOrigen = item.precio * item.mult;
      const convertido = convertir(enOrigen, item.origen, destino);
      total += convertido;

      const li = document.createElement('li');
      li.innerHTML = `
        <div class="info">
          <div><strong>${item.mult}</strong> × ${simbolo(item.origen)}${formatearNumero(item.precio)}</div>
          <div class="detalle">${simbolo(item.origen)}${formatearNumero(enOrigen)} → ${sim}${formatearNumero(convertido)}</div>
        </div>
        <div class="valor">${sim}${formatearNumero(convertido)}</div>
        <button class="del" data-i="${i}">×</button>
      `;
      elLista.appendChild(li);
    });

    elLista.querySelectorAll('.del').forEach(b => {
      b.addEventListener('click', () => { items.splice(+b.dataset.i, 1); renderizarLista(); });
    });

    if (items.length === 0) {
      elEmpty.style.display = 'block'; elTotal.textContent = `0,00 ${sim}`;
    } else {
      elEmpty.style.display = 'none'; elTotal.textContent = `${formatearNumero(total)} ${sim}`;
    }
  }

  function agregarItem() {
    const precio = parseFloat(inputPrecio.value);
    const mult = parseFloat(inputMult.value) || 1;
    const t = getTasas();
    if (!precio || precio <= 0) { alert('Ingresa un precio válido'); return; }
    if (t.USD === 0) { alert('Primero selecciona o actualiza una tasa'); return; }
    
    items.push({ precio, mult, origen: selOrigen.value });
    setTimeout(() => { document.querySelector('.scroll-area').scrollTop = document.querySelector('.scroll-area').scrollHeight; }, 50);

    inputPrecio.value = ''; inputMult.value = '1';
    elResultado.textContent = '0,00';
    renderizarLista();
    inputPrecio.focus();
  }

  // --- 7. EVENTOS ---
  $('btn-actualizar').addEventListener('click', obtenerTasaAPI);
  btnPrev.addEventListener('click', () => navegarFecha(-1));
  btnNext.addEventListener('click', () => navegarFecha(1));
  $('btn-manual').addEventListener('click', agregarTasaManual);

  inputPrecio.addEventListener('input', recalcularPreview);
  inputMult.addEventListener('input', recalcularPreview);
  selOrigen.addEventListener('change', recalcularPreview);
  selDestino.addEventListener('change', () => { recalcularPreview(); renderizarLista(); });
  $('btn-agregar').addEventListener('click', agregarItem);

  $('btn-foto').addEventListener('click', abrirEscaner);
  $('btn-cancel-scan').addEventListener('click', cerrarEscaner);
  btnConfirmScan.addEventListener('click', () => {
    if (ultimoNumeroDetectado !== null) {
      inputPrecio.value = ultimoNumeroDetectado.toFixed(2);
      recalcularPreview();
    }
    cerrarEscaner();
  });

  $('btn-limpiar').addEventListener('click', () => {
    if (items.length && confirm('¿Borrar toda la lista?')) { items = []; renderizarLista(); }
  });

  // --- 8. ARRANQUE ---
  cargarHistorial();
  if (Object.keys(tasasHistorial).length > 0) {
    fechaActual = fechasOrdenadas().pop();
    actualizarInterfazTasas();
  } else {
    obtenerTasaAPI();
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
